services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campus_clinic
      POSTGRES_USER: campus_clinic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_clinic -d campus_clinic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
